openapi: 3.1.0
info:
  title: CAVI API
  version: 0.1.0
  description: |
    HTTP API for CAVI. This document is the source of truth for the
    contract between the Go API and its clients. The TypeScript client in
    packages/api-client is generated from it.

    Every response carries an `X-Request-ID` header. A well-formed incoming
    `X-Request-ID` (1-128 characters of `A-Z a-z 0-9 . _ -`) is preserved;
    otherwise the API generates one.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Reports that the API process is serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Reports whether the API's dependencies (PostgreSQL) are reachable.
      tags: [health]
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the early-access waitlist
      description: |
        Adds an email address to the early-access waitlist. The response is
        identical whether or not the address was already on the list.

        Rate limited per client IP (10 requests per hour per API instance).
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistRequest"
      responses:
        "202":
          description: The address is on the waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    get:
      operationId: startSignIn
      summary: Start sign-in
      description: |
        Browser navigation, not an XHR. Sets a short-lived state cookie and
        redirects to the hosted sign-in page.
      tags: [auth]
      parameters:
        - name: screen
          in: query
          required: false
          schema:
            type: string
            enum: [sign-in, sign-up]
      responses:
        "302":
          description: Redirect to the hosted sign-in page.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/callback:
    get:
      operationId: completeSignIn
      summary: Complete sign-in
      description: |
        Browser navigation from the identity provider. On success sets the
        `cavi_session` cookie (HttpOnly, SameSite=Lax) and redirects to
        `{web}/account`. On failure redirects to
        `{web}/account?auth_error=<code>` where code is one of `cancelled`,
        `invalid_state` or `sign_in_failed`.
      tags: [auth]
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect back to the web app.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the CAVI session and clears the cookie. The browser should then
        navigate to `redirect_url`, which also ends the identity provider's
        session. The request `Origin` must be an allowed web origin.
      tags: [auth]
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      description: The signed-in user and the organisations they belong to.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations:
    post:
      operationId: createOrganisation
      summary: Create a team organisation
      description: |
        Creates a team organisation with a `Main` workspace. The caller becomes its owner.
        Requires an allowed `Origin`.
      tags: [organisations]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}:
    get:
      operationId: getOrganisation
      summary: Get an organisation
      description: |
        The organisation as seen by the caller, with their role and permissions.
        Returns 404 if the caller is not a member.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameOrganisation
      summary: Rename an organisation
      description: |
        Requires `organisation.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members:
    get:
      operationId: listMembers
      summary: List members
      description: |
        Requires `organisation.members.read`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members/{userID}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Requires `organisation.members.manage`. Only owners can grant or remove the owner
        role. The last owner cannot be demoted (`last_owner`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMember
      summary: Remove a member or leave
      description: |
        Members can always remove themselves (leave). Removing others requires
        `organisation.members.manage`; only owners can remove owners. The last owner
        cannot leave or be removed.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations:
    get:
      operationId: listInvitations
      summary: List pending invitations
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvitation
      summary: Invite someone
      description: |
        Requires `organisation.members.manage`. Only owners can invite owners. The invitee
        sees the invitation after signing in with a verified email matching `email`.
        Personal organisations cannot invite (`personal_organisation`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations:
    get:
      operationId: listMyInvitations
      summary: My pending invitations
      description: |
        Pending invitations addressed to the caller's verified email.
      tags: [organisations]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Only the user whose verified email matches the invitation can accept it.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/decline:
    post:
      operationId: declineInvitation
      summary: Decline an invitation
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cavi_session

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready

    Discipline:
      type: string
      description: How the person describes their creative work.
      enum: [clipper, creator, musician, studio, agency, brand, other]

    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        discipline:
          $ref: "#/components/schemas/Discipline"
        company_website:
          type: string
          description: Honeypot. Must be left empty by real clients.

    JoinWaitlistResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: joined

    SignOutResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri

    Me:
      type: object
      required: [user, organisations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationMembership"

    User:
      type: object
      required: [id, email, first_name, last_name, avatar_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string, description: "Empty when the user has no picture." }

    OrganisationMembership:
      type: object
      required: [id, name, personal, role, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's own personal organisation.
        role:
          type: string
          enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Role:
      type: string
      enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]

    Organisation:
      type: object
      required: [id, name, personal, role, permissions, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: Capabilities the caller has in this organisation.
          items: { type: string }
        created_at: { type: string, format: date-time }

    OrganisationNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"

    Member:
      type: object
      required: [user_id, email, first_name, last_name, avatar_url, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    Invitation:
      type: object
      required: [id, organisation_id, organisation_name, email, role, invited_by_name, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        organisation_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_request
            - validation_failed
            - payload_too_large
            - rate_limited
            - unauthenticated
            - forbidden
            - email_not_verified
            - last_owner
            - personal_organisation
            - already_member
            - invitation_exists
            - not_found
            - method_not_allowed
            - internal_error
            - service_unavailable
        message:
          type: string
          description: Human-readable message safe to show to end users.
        request_id:
          type: string
        fields:
          type: array
          description: Per-field problems, present on validation_failed.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    NotFound:
      description: Not found, or the caller is not a member of the organisation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        The change conflicts with an organisation rule. `error.code` is one of
        `last_owner`, `personal_organisation`, `already_member` or `invitation_exists`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Not signed in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is not allowed (for example, from a disallowed origin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more fields are invalid. See `error.fields`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
