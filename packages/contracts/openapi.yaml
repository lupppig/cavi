openapi: 3.1.0
info:
  title: CAVI API
  version: 0.1.0
  description: |
    HTTP API for CAVI. This document is the source of truth for the
    contract between the Go API and its clients. The TypeScript client in
    packages/api-client is generated from it.

    Every response carries an `X-Request-ID` header. A well-formed incoming
    `X-Request-ID` (1-128 characters of `A-Z a-z 0-9 . _ -`) is preserved;
    otherwise the API generates one.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Reports that the API process is serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Reports whether the API's dependencies (PostgreSQL) are reachable.
      tags: [health]
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the early-access waitlist
      description: |
        Adds an email address to the early-access waitlist. The response is
        identical whether or not the address was already on the list.

        Rate limited per client IP (10 requests per hour per API instance).
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistRequest"
      responses:
        "202":
          description: The address is on the waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    get:
      operationId: startSignIn
      summary: Start sign-in
      description: |
        Browser navigation, not an XHR. Sets a short-lived state cookie and
        redirects to Google sign-in (via WorkOS). Google is the only
        supported sign-in method; sign-in and sign-up are the same flow, and
        the first sign-in creates the account. Callbacks from any other
        method are refused with `auth_error=sign_in_failed`.
      tags: [auth]
      responses:
        "302":
          description: Redirect to Google sign-in.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/callback:
    get:
      operationId: completeSignIn
      summary: Complete sign-in
      description: |
        Browser navigation from the identity provider. On success sets the
        `cavi_session` cookie (HttpOnly, SameSite=Lax) and redirects to
        `{web}/account`. On failure redirects to
        `{web}/account?auth_error=<code>` where code is one of `cancelled`,
        `invalid_state` or `sign_in_failed`.
      tags: [auth]
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect back to the web app.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the CAVI session and clears the cookie. The browser should then
        navigate to `redirect_url`, which also ends the identity provider's
        session. The request `Origin` must be an allowed web origin.
      tags: [auth]
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      description: The signed-in user and the organisations they belong to.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations:
    post:
      operationId: createOrganisation
      summary: Create a team organisation
      description: |
        Creates a team organisation with a `Main` workspace. The caller becomes its owner.
        Requires an allowed `Origin`.
      tags: [organisations]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}:
    get:
      operationId: getOrganisation
      summary: Get an organisation
      description: |
        The organisation as seen by the caller, with their role and permissions.
        Returns 404 if the caller is not a member.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameOrganisation
      summary: Rename an organisation
      description: |
        Requires `organisation.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members:
    get:
      operationId: listMembers
      summary: List members
      description: |
        Requires `organisation.members.read`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members/{userID}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Requires `organisation.members.manage`. Only owners can grant or remove the owner
        role. The last owner cannot be demoted (`last_owner`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMember
      summary: Remove a member or leave
      description: |
        Members can always remove themselves (leave). Removing others requires
        `organisation.members.manage`; only owners can remove owners. The last owner
        cannot leave or be removed.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations:
    get:
      operationId: listInvitations
      summary: List pending invitations
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvitation
      summary: Invite someone
      description: |
        Requires `organisation.members.manage`. Only owners can invite owners. The invitee
        sees the invitation after signing in with a verified email matching `email`.
        Personal organisations cannot invite (`personal_organisation`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects:
    get:
      operationId: listProjects
      summary: List projects
      description: |
        Projects the caller can see, newest first. Requires `project.read`.
        Clients see only projects explicitly shared with them. Paged with an
        opaque cursor: pass `next_cursor` from one page to get the next;
        it is null on the last page.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProject
      summary: Create a project
      description: |
        Requires `project.create`. `workspace_id` defaults to the
        organisation's first workspace; a workspace outside the organisation
        is a validation error on `workspace_id`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}:
    get:
      operationId: getProject
      summary: Get a project
      description: Projects the caller can't see return 404.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        Requires `project.update`. Creators can update only projects they
        created. Omitted fields are left unchanged.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Requires `project.delete`. Permanent.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/access:
    get:
      operationId: listProjectAccess
      summary: List who a project is shared with
      description: Requires `project.access.manage`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: People with explicit access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: grantProjectAccess
      summary: Share a project with a client
      description: |
        Requires `project.access.manage`. The person must be a member of the
        organisation with the `client` role; other roles already see every
        project. Sharing twice is a no-op.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantProjectAccessRequest"
      responses:
        "204":
          description: Shared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/access/{userID}:
    delete:
      operationId: revokeProjectAccess
      summary: Stop sharing a project with someone
      description: Requires `project.access.manage`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Access removed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/media:
    get:
      operationId: listMedia
      summary: List a project's media
      description: |
        Uploaded files in a project the caller can see, newest first, each
        with a signed `url` valid for about an hour. Unfinished uploads are
        not listed. Paged like projects.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of media.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/uploads:
    post:
      operationId: createMediaUpload
      summary: Start an upload
      description: |
        Requires `media.upload`. Records the file as `uploading` and returns
        a signed instruction: the browser sends the file with
        `upload.method` to `upload.url`, setting every header in
        `upload.headers`, before `upload.expires_at` (15 minutes). Then
        call `complete`. Files may be up to 5 GB. `content_type` is the
        browser's guess and only pre-filters; the real type is checked from
        the file's contents on completion.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}:
    get:
      operationId: getMedia
      summary: Get one media file
      description: Returns the file with a fresh signed `url`.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The media file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMedia
      summary: Delete a media file
      description: |
        Requires `media.delete`, except that people may delete their own
        uploads. The stored file is removed in the background.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/complete:
    post:
      operationId: completeMediaUpload
      summary: Finish an upload
      description: |
        Call after the browser has sent the file. The API checks the stored
        file: its size must match `size_bytes` and its contents must be a
        supported video, audio or image format. On success the file is
        `uploaded`. `upload_incomplete` (409) means the file hasn't arrived;
        `upload_rejected` (422) means it failed checks and was discarded.
        Repeating the call on an uploaded file returns it unchanged. Only
        the person who started the upload can complete it.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The uploaded file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/process:
    post:
      operationId: reprocessMedia
      summary: Retry processing
      description: |
        Requires `media.upload`. Queues processing again for a file whose
        processing failed. A file that is already processed is returned
        unchanged; one that is queued or processing is
        `processing_in_progress` (409).
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Processing queued (or the file is already processed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/transcript:
    get:
      operationId: getTranscript
      summary: Get a file's transcript
      description: |
        Anyone who can see the project can read it. 404 when the file has
        never been transcribed. Segments are present once `status` is `ready`.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: requestTranscript
      summary: Transcribe a file's speech
      description: |
        Requires `editing.manage`. The file must be processed, have audio
        and be at most 3 hours long (`validation_failed` on `media`
        otherwise). The audio is sent to the organisation's chosen AI
        provider and model (see `ai-models`); the choice is fixed on the
        transcript and recorded in the audit log. Requesting again after a
        transcript is ready or failed replaces it;
        `transcription_in_progress` (409) while one is queued or running.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Transcription queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/transcript/speakers/{label}:
    patch:
      operationId: setSpeakerVoice
      summary: Correct how a speaker's voice is labelled
      description: |
        Requires `editing.manage`. Voices are suggested by the transcription
        model from how a voice sounds; this records a person's correction
        (`voice_set_by` becomes `person`) and is audited. 404 if the file has
        no ready transcript or no speaker with that label.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
        - name: label
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voice]
              additionalProperties: false
              properties:
                voice: { type: string, enum: [woman, man, unclear] }
      responses:
        "200":
          description: The transcript after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/highlights:
    get:
      operationId: getHighlights
      summary: Get a file's candidate clips
      description: |
        Anyone who can see the project can read them. 404 when highlights
        have never been requested for the file. Clips are present once
        `status` is `ready`, best first.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The current highlight run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlights"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: requestHighlights
      summary: Find candidate clips in a file's transcript
      description: |
        Requires `editing.manage`. The file must have a ready transcript with
        speech (`validation_failed` on `media` otherwise). The transcript
        text, not the media, is sent to the organisation's chosen AI
        provider and model for the `highlights` task; the choice and the
        brief are fixed on the run and the request is recorded in the audit
        log. Clips are cut on whole transcript lines. Requesting again after
        a run is ready or failed replaces it; `highlights_in_progress` (409)
        while one is queued or running.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestHighlightsRequest"
      responses:
        "202":
          description: Highlight detection queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlights"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/brief:
    get:
      operationId: getBrief
      summary: Get the project's creator brief
      description: |
        Anyone who can see the project can read it. 404 when the project has
        no brief. Rules are present once `status` is `ready`, in time order.
      tags: [briefs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: submitBrief
      summary: Submit a creator brief to be read into rules
      description: |
        Requires `project.update`. `media_asset_id` is the processed video or
        audio file in this project that the brief's timestamps refer to. The
        brief's text, not the media, is sent to the organisation's chosen AI
        provider and model for the `briefs` task, which reads it into a
        campaign message, guidance and timed rules. Every rule time must be
        written in the brief and lie within the file. Submitting replaces the
        brief and its rules; `brief_in_progress` (409) while it is being read.
        Recorded in the audit log.
      tags: [briefs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBriefRequest"
      responses:
        "202":
          description: Brief saved and queued to be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateBrief
      summary: Save a reviewed brief
      description: |
        Requires `project.update` and a `ready` brief (`brief_in_progress`
        otherwise). Replaces the campaign message, guidance and the whole list
        of rules. Rules must be on the brief's file and within it. Recorded in
        the audit log.
      tags: [briefs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBriefRequest"
      responses:
        "200":
          description: The saved brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteBrief
      summary: Delete the project's brief and its rules
      description: Requires `project.update`. Recorded in the audit log.
      tags: [briefs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/renders:
    get:
      operationId: listRenders
      summary: List a project's rendered clips
      description: |
        Renders in a project the caller can see, newest first, optionally
        only those made from one source file. Ready renders carry a signed
        `output.url` valid for about an hour. Paged like media.
      tags: [renders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - name: source_asset_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of renders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRender
      summary: Render a clip
      description: |
        Requires `render.execute`. Queues a render of the composition: the
        source must be a processed video in this project
        (`validation_failed` on `composition.source_asset_id` otherwise), the
        clip 1 second to 10 minutes long and inside the file. Output is
        H.264/AAC MP4 at the shape's platform size (9:16 1080x1920, 1:1
        1080x1080, 4:5 1080x1350, 16:9 1920x1080), scaling up smaller
        sources. The request is recorded in the audit log.
      tags: [renders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRenderRequest"
      responses:
        "202":
          description: Render queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/renders/{renderID}:
    get:
      operationId: getRender
      summary: Get a rendered clip
      tags: [renders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/RenderID"
      responses:
        "200":
          description: The render.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteRender
      summary: Delete a rendered clip
      description: |
        Requires `render.execute`. Removes the clip and its file; a render
        still in progress is cancelled. Recorded in the audit log.
      tags: [renders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/RenderID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/ai-models:
    get:
      operationId: listAIModelSettings
      summary: List the organisation's AI model per task
      description: |
        Any member can read them. Each task shows the model in use, whether
        the organisation chose it (`custom`) or it's the platform default,
        and the supported options.
      tags: [ai]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Settings per task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIModelSettingList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/ai-models/{task}:
    put:
      operationId: setAIModel
      summary: Choose the organisation's model for a task
      description: |
        Requires `organisation.manage`. Only supported models are accepted;
        an empty `model` returns to the platform default. Work already
        requested keeps the model it was requested with.
      tags: [ai]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: task
          in: path
          required: true
          schema: { type: string, enum: [transcription, highlights, briefs] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAIModelRequest"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/invitations:
    get:
      operationId: listMyInvitations
      summary: My pending invitations
      description: |
        Pending invitations addressed to the caller's verified email.
      tags: [organisations]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Only the user whose verified email matches the invitation can accept it.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/decline:
    post:
      operationId: declineInvitation
      summary: Decline an invitation
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetID:
      name: assetID
      in: path
      required: true
      schema: { type: string, format: uuid }
    RenderID:
      name: renderID
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cavi_session

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready

    Discipline:
      type: string
      description: How the person describes their creative work.
      enum: [clipper, creator, musician, studio, agency, brand, other]

    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        discipline:
          $ref: "#/components/schemas/Discipline"
        company_website:
          type: string
          description: Honeypot. Must be left empty by real clients.

    JoinWaitlistResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: joined

    SignOutResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri

    Me:
      type: object
      required: [user, organisations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationMembership"

    User:
      type: object
      required: [id, email, first_name, last_name, avatar_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string, description: "Empty when the user has no picture." }

    OrganisationMembership:
      type: object
      required: [id, name, personal, role, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's own personal organisation.
        role:
          type: string
          enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Role:
      type: string
      enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]

    Organisation:
      type: object
      required: [id, name, personal, role, permissions, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: Capabilities the caller has in this organisation.
          items: { type: string }
        created_at: { type: string, format: date-time }

    OrganisationNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"

    Member:
      type: object
      required: [user_id, email, first_name, last_name, avatar_url, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    Invitation:
      type: object
      required: [id, organisation_id, organisation_name, email, role, invited_by_name, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        organisation_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }

    Project:
      type: object
      required: [id, organisation_id, workspace, name, description, created_by, created_at, updated_at, permissions]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        workspace: { $ref: "#/components/schemas/Workspace" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        created_by:
          description: Null when the creator's account no longer exists.
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        permissions:
          type: array
          description: |
            Project-level actions the caller may take: any of `project.read`,
            `project.update`, `project.delete`, `project.access.manage`.
          items: { type: string }

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ProjectPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_cursor:
          type: [string, "null"]

    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        workspace_id: { type: string, format: uuid }

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }

    GrantProjectAccessRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }

    ProjectAccess:
      type: object
      required: [user_id, email, first_name, last_name, avatar_url, granted_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        granted_at: { type: string, format: date-time }

    ProjectAccessList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectAccess" }

    MediaAsset:
      type: object
      required: [id, project_id, filename, kind, content_type, size_bytes, status, uploaded_by, created_at, uploaded_at, can_delete, url, url_expires_at, thumbnail_url, processing, metadata]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        filename: { type: string }
        kind:
          description: Decided from the file's contents; null until uploaded.
          type: [string, "null"]
          enum: [video, audio, image, null]
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [uploading, uploaded] }
        uploaded_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        uploaded_at: { type: [string, "null"], format: date-time }
        can_delete: { type: boolean }
        url:
          description: Signed link to the file; null until uploaded. Don't store it.
          type: [string, "null"]
        url_expires_at: { type: [string, "null"], format: date-time }
        thumbnail_url:
          description: Signed link to a JPEG preview (video and images), once processed.
          type: [string, "null"]
        processing:
          type: object
          description: |
            Background processing (probing and thumbnails). `pending` is queued;
            `failed` carries a user-facing `error` and can be retried with
            `POST .../process`.
          required: [status, error]
          properties:
            status: { type: string, enum: [pending, processing, ready, failed] }
            error: { type: [string, "null"] }
        metadata:
          description: What processing learned; null until ready. Fields that don't apply are null.
          oneOf:
            - $ref: "#/components/schemas/MediaMetadata"
            - type: "null"

    MediaMetadata:
      type: object
      required: [container, duration_ms, width, height, frame_rate, video_codec, audio_codec, audio_channels, sample_rate]
      properties:
        container: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"], format: int64 }
        width: { type: [integer, "null"], description: Display width after rotation. }
        height: { type: [integer, "null"], description: Display height after rotation. }
        frame_rate: { type: [number, "null"] }
        video_codec: { type: [string, "null"] }
        audio_codec: { type: [string, "null"] }
        audio_channels: { type: [integer, "null"] }
        sample_rate: { type: [integer, "null"] }

    MediaPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
        next_cursor:
          type: [string, "null"]

    CreateUploadRequest:
      type: object
      required: [filename, size_bytes]
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }

    MediaUpload:
      type: object
      required: [asset, upload]
      properties:
        asset: { $ref: "#/components/schemas/MediaAsset" }
        upload:
          type: object
          required: [url, method, headers, expires_at]
          properties:
            url: { type: string }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }
            expires_at: { type: string, format: date-time }

    Transcript:
      type: object
      required: [id, media_asset_id, status, provider, model, model_label, prompt_version, language, error, requested_at, completed_at, segments, speakers]
      properties:
        id: { type: string, format: uuid }
        media_asset_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, failed] }
        provider: { type: string, description: AI provider the audio was sent to. }
        model: { type: string }
        model_label: { type: string }
        prompt_version: { type: string }
        language: { type: [string, "null"], description: BCP-47 code of the main spoken language. }
        error: { type: [string, "null"], description: User-facing reason when failed. }
        requested_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        segments:
          type: array
          description: |
            Speech in order. Speaker labels are per transcript; for media over
            10 minutes they may not match across 10-minute sections.
          items:
            type: object
            required: [start_ms, end_ms, speaker, text]
            properties:
              start_ms: { type: integer, format: int64 }
              end_ms: { type: integer, format: int64 }
              speaker: { type: string }
              text: { type: string }
        speakers:
          type: array
          description: |
            Each speaker label once, in order of first appearance, with how
            their voice sounds. Suggested by the model (`voice_set_by: ai`)
            from the voice alone, and correctable by people.
          items:
            type: object
            required: [label, voice, voice_set_by]
            properties:
              label: { type: string }
              voice: { type: string, enum: [woman, man, unclear] }
              voice_set_by: { type: string, enum: [ai, person] }

    RequestHighlightsRequest:
      type: object
      required: [min_seconds, max_seconds]
      additionalProperties: false
      properties:
        objective:
          type: string
          maxLength: 500
          description: What the editor wants from the clips, in their words. Optional.
        min_seconds: { type: integer, minimum: 5, description: Shortest clip length. }
        max_seconds:
          type: integer
          maximum: 600
          description: Longest clip length; at least 5 seconds more than `min_seconds`.

    BriefRuleKind:
      type: string
      enum: [priority, exclude, blur, mute, caution, review]
      description: |
        `priority`: a moment the creator wants featured. `exclude`: must never
        appear in a clip; clips that touch it can't be rendered. `blur`:
        something visible must be blurred or cropped out. `mute`: audio that
        must not be used. `caution`: a sensitive topic or third-party branding
        not to feature. `review`: a person must check it before it is used.

    BriefRule:
      type: object
      required: [media_asset_id, kind, start_ms, end_ms, note]
      properties:
        media_asset_id: { type: string, format: uuid, description: The file the rule's times are in. }
        kind: { $ref: "#/components/schemas/BriefRuleKind" }
        start_ms: { type: integer, format: int64, minimum: 0 }
        end_ms:
          type: integer
          format: int64
          minimum: 0
          description: Equal to `start_ms` for a single timestamp.
        note: { type: string, minLength: 1, maxLength: 300 }

    BriefFlag:
      type: object
      description: A creator brief rule a clip touches (any kind but `priority`), from the brief as it is now.
      required: [kind, start_ms, end_ms, note]
      properties:
        kind: { $ref: "#/components/schemas/BriefRuleKind" }
        start_ms: { type: integer, format: int64 }
        end_ms: { type: integer, format: int64 }
        note: { type: string }

    Brief:
      type: object
      required: [id, project_id, media_asset_id, text, campaign_message, guidance, status, provider, model, model_label, prompt_version, error, requested_at, updated_at, completed_at, rules, can_edit]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        media_asset_id:
          type: [string, "null"]
          format: uuid
          description: The file the brief's timestamps refer to; null once it is deleted.
        text: { type: string, description: The brief as pasted. }
        campaign_message: { type: string, description: What every clip should connect back to. }
        guidance: { type: string, description: Creative direction without timestamps. }
        status: { type: string, enum: [queued, running, ready, failed] }
        provider: { type: string }
        model: { type: string }
        model_label: { type: string }
        prompt_version: { type: string }
        error: { type: [string, "null"], description: Why reading failed, for people. }
        requested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        rules:
          type: array
          items: { $ref: "#/components/schemas/BriefRule" }
        can_edit: { type: boolean, description: Whether the caller may change the brief (`project.update`). }

    SubmitBriefRequest:
      type: object
      required: [text, media_asset_id]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        media_asset_id: { type: string, format: uuid }

    UpdateBriefRequest:
      type: object
      required: [campaign_message, guidance, rules]
      properties:
        campaign_message: { type: string, maxLength: 2000 }
        guidance: { type: string, maxLength: 2000 }
        rules:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/BriefRule" }

    Highlights:
      type: object
      required: [id, media_asset_id, status, provider, model, model_label, prompt_version, objective, min_seconds, max_seconds, used_brief, error, requested_at, completed_at, clips]
      properties:
        id: { type: string, format: uuid }
        media_asset_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, failed] }
        provider: { type: string, description: AI provider the transcript was sent to. }
        model: { type: string }
        model_label: { type: string }
        prompt_version: { type: string }
        objective: { type: string, description: The objective as requested; empty if none. }
        min_seconds: { type: integer }
        max_seconds: { type: integer }
        used_brief:
          type: boolean
          description: Whether the run followed the project's creator brief for this file (copied when highlights were requested).
        error: { type: [string, "null"], description: User-facing reason when failed. }
        requested_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        clips:
          type: array
          description: |
            Candidate clips, best first. Each spans whole transcript lines
            `first_segment` to `last_segment` (indexes into the transcript's
            segments when the clips were found); times are in the source file.
            Clips that include content the project's brief excludes are
            dropped when found; `flags` lists the other brief rules a clip
            touches.
          items:
            type: object
            required: [start_ms, end_ms, first_segment, last_segment, title, reason, campaign_link, flags, priorities]
            properties:
              start_ms: { type: integer, format: int64 }
              end_ms: { type: integer, format: int64 }
              first_segment: { type: integer }
              last_segment: { type: integer }
              title: { type: string }
              reason: { type: string, description: Why the model chose the moment. }
              flags:
                type: array
                items: { $ref: "#/components/schemas/BriefFlag" }
              campaign_link:
                type: string
                description: How the clip connects to the brief's campaign message; empty when the run had no brief.
              priorities:
                type: array
                description: The brief's priority moments this clip features. Such clips are listed first.
                items: { $ref: "#/components/schemas/BriefFlag" }

    Composition:
      type: object
      description: |
        A clip cut from one source file, as sent when creating a render.
        Version 2 adds captions (requested separately; see
        CreateRenderRequest). Version 1 is still accepted.
      required: [version, source_asset_id, start_ms, end_ms, aspect, focus]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1, 2] }
        source_asset_id: { type: string, format: uuid }
        start_ms: { type: integer, format: int64, minimum: 0 }
        end_ms: { type: integer, format: int64, description: Exclusive; 1 s to 10 min after `start_ms`. }
        aspect: { type: string, enum: ["9:16", "1:1", "4:5", "16:9"] }
        focus:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Where the frame sits along the axis the source is cropped on:
            0 left or top, 0.5 centre, 1 right or bottom.

    CaptionOptions:
      type: object
      required: [style]
      properties:
        style:
          type: string
          enum: [bold, boxed]
          description: "`bold`: text with an outline; `boxed`: text on a solid box."
        mode:
          type: string
          enum: [lines, words]
          default: lines
          description: "`words` shows up to three words at a time and highlights the one being said."
        position: { type: string, enum: [bottom, middle, top], default: bottom }
        uppercase: { type: boolean, default: false }
        colors:
          type: object
          description: Defaults to white text, a yellow highlight and a black outline.
          required: [text, highlight, stroke]
          properties:
            text: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
            highlight: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", description: The word being said, in `words` mode. }
            stroke: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", description: The outline (`bold`) or the box (`boxed`). }
        speaker_colors:
          type: object
          description: Text colour per speaker label (up to 20), overriding `colors.text`.
          additionalProperties: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }

    RenderComposition:
      description: The stored composition, with a summary of any captions.
      allOf:
        - $ref: "#/components/schemas/Composition"
        - type: object
          required: [captions]
          properties:
            captions:
              oneOf:
                - allOf:
                    - $ref: "#/components/schemas/CaptionOptions"
                    - type: object
                      required: [cue_count]
                      properties:
                        cue_count: { type: integer }
                - type: "null"

    CreateRenderRequest:
      type: object
      required: [name, composition]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120, description: Also the download filename. }
        composition: { $ref: "#/components/schemas/Composition" }
        captions:
          description: |
            Burn in captions made from the source's transcript (which must be
            ready, with speech in the clip; `validation_failed` on `captions`
            otherwise). The caption text and word timing are copied into the
            composition when the render is created; clients can't send cues.
          allOf:
            - $ref: "#/components/schemas/CaptionOptions"

    Render:
      type: object
      required: [id, project_id, source_asset_id, name, composition, status, error, requested_by, created_at, completed_at, can_delete, output, flags]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        source_asset_id:
          type: [string, "null"]
          format: uuid
          description: Null once the source file is deleted; the clip remains.
        name: { type: string }
        composition: { $ref: "#/components/schemas/RenderComposition" }
        status: { type: string, enum: [queued, running, ready, failed] }
        error: { type: [string, "null"], description: User-facing reason when failed. }
        requested_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        flags:
          type: array
          description: The project brief's rules (other than priorities) this clip touches. Clips can't be rendered over an `exclude` rule.
          items: { $ref: "#/components/schemas/BriefFlag" }
        can_delete: { type: boolean }
        output:
          description: The finished file, once `status` is `ready`.
          oneOf:
            - type: object
              required: [url, url_expires_at, size_bytes, duration_ms, width, height]
              properties:
                url: { type: string, description: Signed; plays inline and downloads under the clip's name. }
                url_expires_at: { type: string, format: date-time }
                size_bytes: { type: integer, format: int64 }
                duration_ms: { type: integer, format: int64 }
                width: { type: integer }
                height: { type: integer }
            - type: "null"

    RenderPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Render" }
        next_cursor:
          type: [string, "null"]

    AIModel:
      type: object
      required: [provider, id, label, default]
      properties:
        provider: { type: string }
        id: { type: string }
        label: { type: string }
        default: { type: boolean, description: The platform default for the task. }

    AIModelSettingList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [task, model, custom, options]
            properties:
              task: { type: string, enum: [transcription, highlights, briefs] }
              model: { $ref: "#/components/schemas/AIModel" }
              custom: { type: boolean }
              options:
                type: array
                items: { $ref: "#/components/schemas/AIModel" }

    SetAIModelRequest:
      type: object
      required: [provider, model]
      additionalProperties: false
      properties:
        provider: { type: string }
        model: { type: string, description: Empty to use the platform default. }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_request
            - validation_failed
            - payload_too_large
            - rate_limited
            - unauthenticated
            - forbidden
            - email_not_verified
            - last_owner
            - personal_organisation
            - already_member
            - invitation_exists
            - upload_incomplete
            - upload_rejected
            - processing_in_progress
            - transcription_in_progress
            - highlights_in_progress
            - brief_in_progress
            - not_found
            - method_not_allowed
            - internal_error
            - service_unavailable
        message:
          type: string
          description: Human-readable message safe to show to end users.
        request_id:
          type: string
        fields:
          type: array
          description: Per-field problems, present on validation_failed.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    NotFound:
      description: Not found, or the caller is not a member of the organisation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        The request conflicts with the resource's state. `error.code` is one of
        `last_owner`, `personal_organisation`, `already_member`, `invitation_exists`,
        `upload_incomplete`, `processing_in_progress`, `transcription_in_progress`,
        `highlights_in_progress` or `brief_in_progress`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Not signed in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is not allowed (for example, from a disallowed origin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more fields are invalid (`validation_failed`, see `error.fields`), or an uploaded file failed checks (`upload_rejected`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
