openapi: 3.1.0
info:
  title: CAVI API
  version: 0.1.0
  description: |
    HTTP API for CAVI. This document is the source of truth for the
    contract between the Go API and its clients. The TypeScript client in
    packages/api-client is generated from it.

    Every response carries an `X-Request-ID` header. A well-formed incoming
    `X-Request-ID` (1-128 characters of `A-Z a-z 0-9 . _ -`) is preserved;
    otherwise the API generates one.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Reports that the API process is serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Reports whether the API's dependencies (PostgreSQL) are reachable.
      tags: [health]
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the early-access waitlist
      description: |
        Adds an email address to the early-access waitlist. The response is
        identical whether or not the address was already on the list.

        Rate limited per client IP (10 requests per hour per API instance).
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistRequest"
      responses:
        "202":
          description: The address is on the waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    get:
      operationId: startSignIn
      summary: Start sign-in
      description: |
        Browser navigation, not an XHR. Sets a short-lived state cookie and
        redirects to Google sign-in (via WorkOS). Google is the only
        supported sign-in method; sign-in and sign-up are the same flow, and
        the first sign-in creates the account. Callbacks from any other
        method are refused with `auth_error=sign_in_failed`.
      tags: [auth]
      responses:
        "302":
          description: Redirect to Google sign-in.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/callback:
    get:
      operationId: completeSignIn
      summary: Complete sign-in
      description: |
        Browser navigation from the identity provider. On success sets the
        `cavi_session` cookie (HttpOnly, SameSite=Lax) and redirects to
        `{web}/account`. On failure redirects to
        `{web}/account?auth_error=<code>` where code is one of `cancelled`,
        `invalid_state` or `sign_in_failed`.
      tags: [auth]
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect back to the web app.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the CAVI session and clears the cookie. The browser should then
        navigate to `redirect_url`, which also ends the identity provider's
        session. The request `Origin` must be an allowed web origin.
      tags: [auth]
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      description: The signed-in user and the organisations they belong to.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations:
    post:
      operationId: createOrganisation
      summary: Create a team organisation
      description: |
        Creates a team organisation with a `Main` workspace. The caller becomes its owner.
        Requires an allowed `Origin`.
      tags: [organisations]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}:
    get:
      operationId: getOrganisation
      summary: Get an organisation
      description: |
        The organisation as seen by the caller, with their role and permissions.
        Returns 404 if the caller is not a member.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameOrganisation
      summary: Rename an organisation
      description: |
        Requires `organisation.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationNameRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members:
    get:
      operationId: listMembers
      summary: List members
      description: |
        Requires `organisation.members.read`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/members/{userID}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Requires `organisation.members.manage`. Only owners can grant or remove the owner
        role. The last owner cannot be demoted (`last_owner`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMember
      summary: Remove a member or leave
      description: |
        Members can always remove themselves (leave). Removing others requires
        `organisation.members.manage`; only owners can remove owners. The last owner
        cannot leave or be removed.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations:
    get:
      operationId: listInvitations
      summary: List pending invitations
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvitation
      summary: Invite someone
      description: |
        Requires `organisation.members.manage`. Only owners can invite owners. The invitee
        sees the invitation after signing in with a verified email matching `email`.
        Personal organisations cannot invite (`personal_organisation`).
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        Requires `organisation.members.manage`.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects:
    get:
      operationId: listProjects
      summary: List projects
      description: |
        Projects the caller can see, newest first. Requires `project.read`.
        Clients see only projects explicitly shared with them. Paged with an
        opaque cursor: pass `next_cursor` from one page to get the next;
        it is null on the last page.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProject
      summary: Create a project
      description: |
        Requires `project.create`. `workspace_id` defaults to the
        organisation's first workspace; a workspace outside the organisation
        is a validation error on `workspace_id`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}:
    get:
      operationId: getProject
      summary: Get a project
      description: Projects the caller can't see return 404.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        Requires `project.update`. Creators can update only projects they
        created. Omitted fields are left unchanged.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Requires `project.delete`. Permanent.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/access:
    get:
      operationId: listProjectAccess
      summary: List who a project is shared with
      description: Requires `project.access.manage`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: People with explicit access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: grantProjectAccess
      summary: Share a project with a client
      description: |
        Requires `project.access.manage`. The person must be a member of the
        organisation with the `client` role; other roles already see every
        project. Sharing twice is a no-op.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantProjectAccessRequest"
      responses:
        "204":
          description: Shared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/access/{userID}:
    delete:
      operationId: revokeProjectAccess
      summary: Stop sharing a project with someone
      description: Requires `project.access.manage`.
      tags: [projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Access removed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/organisations/{orgID}/projects/{projectID}/media:
    get:
      operationId: listMedia
      summary: List a project's media
      description: |
        Uploaded files in a project the caller can see, newest first, each
        with a signed `url` valid for about an hour. Unfinished uploads are
        not listed. Paged like projects.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of media.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/uploads:
    post:
      operationId: createMediaUpload
      summary: Start an upload
      description: |
        Requires `media.upload`. Records the file as `uploading` and returns
        a signed instruction: the browser sends the file with
        `upload.method` to `upload.url`, setting every header in
        `upload.headers`, before `upload.expires_at` (15 minutes). Then
        call `complete`. Files may be up to 5 GB. `content_type` is the
        browser's guess and only pre-filters; the real type is checked from
        the file's contents on completion.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}:
    get:
      operationId: getMedia
      summary: Get one media file
      description: Returns the file with a fresh signed `url`.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The media file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMedia
      summary: Delete a media file
      description: |
        Requires `media.delete`, except that people may delete their own
        uploads. The stored file is removed in the background.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/complete:
    post:
      operationId: completeMediaUpload
      summary: Finish an upload
      description: |
        Call after the browser has sent the file. The API checks the stored
        file: its size must match `size_bytes` and its contents must be a
        supported video, audio or image format. On success the file is
        `uploaded`. `upload_incomplete` (409) means the file hasn't arrived;
        `upload_rejected` (422) means it failed checks and was discarded.
        Repeating the call on an uploaded file returns it unchanged. Only
        the person who started the upload can complete it.
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The uploaded file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organisations/{orgID}/projects/{projectID}/media/{assetID}/process:
    post:
      operationId: reprocessMedia
      summary: Retry processing
      description: |
        Requires `media.upload`. Queues processing again for a file whose
        processing failed. A file that is already processed is returned
        unchanged; one that is queued or processing is
        `processing_in_progress` (409).
      tags: [media]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Processing queued (or the file is already processed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/invitations:
    get:
      operationId: listMyInvitations
      summary: My pending invitations
      description: |
        Pending invitations addressed to the caller's verified email.
      tags: [organisations]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Only the user whose verified email matches the invitation can accept it.
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/{invitationID}/decline:
    post:
      operationId: declineInvitation
      summary: Decline an invitation
      tags: [organisations]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Done.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetID:
      name: assetID
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cavi_session

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready

    Discipline:
      type: string
      description: How the person describes their creative work.
      enum: [clipper, creator, musician, studio, agency, brand, other]

    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        discipline:
          $ref: "#/components/schemas/Discipline"
        company_website:
          type: string
          description: Honeypot. Must be left empty by real clients.

    JoinWaitlistResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: joined

    SignOutResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri

    Me:
      type: object
      required: [user, organisations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationMembership"

    User:
      type: object
      required: [id, email, first_name, last_name, avatar_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string, description: "Empty when the user has no picture." }

    OrganisationMembership:
      type: object
      required: [id, name, personal, role, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's own personal organisation.
        role:
          type: string
          enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Role:
      type: string
      enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]

    Organisation:
      type: object
      required: [id, name, personal, role, permissions, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: Capabilities the caller has in this organisation.
          items: { type: string }
        created_at: { type: string, format: date-time }

    OrganisationNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"

    Member:
      type: object
      required: [user_id, email, first_name, last_name, avatar_url, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    Invitation:
      type: object
      required: [id, organisation_id, organisation_name, email, role, invited_by_name, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        organisation_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }

    Project:
      type: object
      required: [id, organisation_id, workspace, name, description, created_by, created_at, updated_at, permissions]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        workspace: { $ref: "#/components/schemas/Workspace" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        created_by:
          description: Null when the creator's account no longer exists.
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        permissions:
          type: array
          description: |
            Project-level actions the caller may take: any of `project.read`,
            `project.update`, `project.delete`, `project.access.manage`.
          items: { type: string }

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ProjectPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_cursor:
          type: [string, "null"]

    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        workspace_id: { type: string, format: uuid }

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }

    GrantProjectAccessRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }

    ProjectAccess:
      type: object
      required: [user_id, email, first_name, last_name, avatar_url, granted_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        granted_at: { type: string, format: date-time }

    ProjectAccessList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectAccess" }

    MediaAsset:
      type: object
      required: [id, project_id, filename, kind, content_type, size_bytes, status, uploaded_by, created_at, uploaded_at, can_delete, url, url_expires_at, thumbnail_url, processing, metadata]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        filename: { type: string }
        kind:
          description: Decided from the file's contents; null until uploaded.
          type: [string, "null"]
          enum: [video, audio, image, null]
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [uploading, uploaded] }
        uploaded_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        uploaded_at: { type: [string, "null"], format: date-time }
        can_delete: { type: boolean }
        url:
          description: Signed link to the file; null until uploaded. Don't store it.
          type: [string, "null"]
        url_expires_at: { type: [string, "null"], format: date-time }
        thumbnail_url:
          description: Signed link to a JPEG preview (video and images), once processed.
          type: [string, "null"]
        processing:
          type: object
          description: |
            Background processing (probing and thumbnails). `pending` is queued;
            `failed` carries a user-facing `error` and can be retried with
            `POST .../process`.
          required: [status, error]
          properties:
            status: { type: string, enum: [pending, processing, ready, failed] }
            error: { type: [string, "null"] }
        metadata:
          description: What processing learned; null until ready. Fields that don't apply are null.
          oneOf:
            - $ref: "#/components/schemas/MediaMetadata"
            - type: "null"

    MediaMetadata:
      type: object
      required: [container, duration_ms, width, height, frame_rate, video_codec, audio_codec, audio_channels, sample_rate]
      properties:
        container: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"], format: int64 }
        width: { type: [integer, "null"], description: Display width after rotation. }
        height: { type: [integer, "null"], description: Display height after rotation. }
        frame_rate: { type: [number, "null"] }
        video_codec: { type: [string, "null"] }
        audio_codec: { type: [string, "null"] }
        audio_channels: { type: [integer, "null"] }
        sample_rate: { type: [integer, "null"] }

    MediaPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
        next_cursor:
          type: [string, "null"]

    CreateUploadRequest:
      type: object
      required: [filename, size_bytes]
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }

    MediaUpload:
      type: object
      required: [asset, upload]
      properties:
        asset: { $ref: "#/components/schemas/MediaAsset" }
        upload:
          type: object
          required: [url, method, headers, expires_at]
          properties:
            url: { type: string }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }
            expires_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_request
            - validation_failed
            - payload_too_large
            - rate_limited
            - unauthenticated
            - forbidden
            - email_not_verified
            - last_owner
            - personal_organisation
            - already_member
            - invitation_exists
            - upload_incomplete
            - upload_rejected
            - processing_in_progress
            - not_found
            - method_not_allowed
            - internal_error
            - service_unavailable
        message:
          type: string
          description: Human-readable message safe to show to end users.
        request_id:
          type: string
        fields:
          type: array
          description: Per-field problems, present on validation_failed.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    NotFound:
      description: Not found, or the caller is not a member of the organisation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        The request conflicts with the resource's state. `error.code` is one of
        `last_owner`, `personal_organisation`, `already_member`, `invitation_exists`,
        `upload_incomplete` or `processing_in_progress`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Not signed in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is not allowed (for example, from a disallowed origin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more fields are invalid (`validation_failed`, see `error.fields`), or an uploaded file failed checks (`upload_rejected`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
