openapi: 3.1.0
info:
  title: CAVI API
  version: 0.1.0
  description: |
    HTTP API for CAVI. This document is the source of truth for the
    contract between the Go API and its clients. The TypeScript client in
    packages/api-client is generated from it.

    Every response carries an `X-Request-ID` header. A well-formed incoming
    `X-Request-ID` (1-128 characters of `A-Z a-z 0-9 . _ -`) is preserved;
    otherwise the API generates one.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Reports that the API process is serving HTTP.
      tags: [health]
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Reports whether the API's dependencies (PostgreSQL) are reachable.
      tags: [health]
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the early-access waitlist
      description: |
        Adds an email address to the early-access waitlist. The response is
        identical whether or not the address was already on the list.

        Rate limited per client IP (10 requests per hour per API instance).
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistRequest"
      responses:
        "202":
          description: The address is on the waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    get:
      operationId: startSignIn
      summary: Start sign-in
      description: |
        Browser navigation, not an XHR. Sets a short-lived state cookie and
        redirects to the hosted sign-in page.
      tags: [auth]
      parameters:
        - name: screen
          in: query
          required: false
          schema:
            type: string
            enum: [sign-in, sign-up]
      responses:
        "302":
          description: Redirect to the hosted sign-in page.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/callback:
    get:
      operationId: completeSignIn
      summary: Complete sign-in
      description: |
        Browser navigation from the identity provider. On success sets the
        `cavi_session` cookie (HttpOnly, SameSite=Lax) and redirects to
        `{web}/account`. On failure redirects to
        `{web}/account?auth_error=<code>` where code is one of `cancelled`,
        `invalid_state` or `sign_in_failed`.
      tags: [auth]
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect back to the web app.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the CAVI session and clears the cookie. The browser should then
        navigate to `redirect_url`, which also ends the identity provider's
        session. The request `Origin` must be an allowed web origin.
      tags: [auth]
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      description: The signed-in user and the organisations they belong to.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cavi_session

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready

    Discipline:
      type: string
      description: How the person describes their creative work.
      enum: [clipper, creator, musician, studio, agency, brand, other]

    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        discipline:
          $ref: "#/components/schemas/Discipline"
        company_website:
          type: string
          description: Honeypot. Must be left empty by real clients.

    JoinWaitlistResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: joined

    SignOutResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri

    Me:
      type: object
      required: [user, organisations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationMembership"

    User:
      type: object
      required: [id, email, first_name, last_name, avatar_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string, description: "Empty when the user has no picture." }

    OrganisationMembership:
      type: object
      required: [id, name, personal, role, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's own personal organisation.
        role:
          type: string
          enum: [owner, admin, manager, editor, creator, reviewer, viewer, client]
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_request
            - validation_failed
            - payload_too_large
            - rate_limited
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - internal_error
            - service_unavailable
        message:
          type: string
          description: Human-readable message safe to show to end users.
        request_id:
          type: string
        fields:
          type: array
          description: Per-field problems, present on validation_failed.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    Unauthenticated:
      description: Not signed in, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is not allowed (for example, from a disallowed origin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more fields are invalid. See `error.fields`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
