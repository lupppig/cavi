# Local development dependencies. Not used for staging or production.
name: cavi

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cavi
      POSTGRES_PASSWORD: cavi_local_dev
      POSTGRES_DB: cavi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavi -d cavi"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible object storage standing in for Cloudflare R2 locally.
  # Credentials are in seaweedfs/s3.json (local only). Run
  # `make storage-setup` once to create the bucket and its CORS rules.
  storage:
    image: chrislusf/seaweedfs:3.97
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=20 -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # NATS JetStream: delivers background jobs to workers. Job state itself
  # lives in Postgres.
  nats:
    image: nats:2.12.1-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  storage-data:
  nats-data:
